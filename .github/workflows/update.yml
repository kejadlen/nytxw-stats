name: update
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: rake backfill
        env:
          NYT_S: ${{ secrets.NYT_S }}
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "<>"
          # Backfill rewrites every file it fetches, so only the index sees
          # whether the contents actually changed.
          git add 'data/**/*.json'
          if ! git diff --cached --quiet; then
            git commit -m "$(date -I)"
            git push
          fi
